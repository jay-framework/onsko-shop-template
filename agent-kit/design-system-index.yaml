components:
  - name: site-footer
    contractPath: ./src/components/site-footer/site-footer.jay-contract
    source: local
    templates:
      - path: ./src/components/site-footer/site-footer.jay-html
        variant: ""
  - name: site-header
    contractPath: ./src/components/site-header/site-header.jay-contract
    source: local
    templates:
      - path: ./src/components/site-header/site-header.jay-html
        variant: ""
  - name: popover-menu
    contractPath: ./node_modules/@jay-framework/ui-kit/dist/popover-menu.jay-contract
    source: plugin
    plugin: ui-kit
    templates: []
  - name: scroll-carousel
    contractPath: ./node_modules/@jay-framework/ui-kit/dist/scroll-carousel.jay-contract
    source: plugin
    plugin: ui-kit
    templates: []
  - name: clipboard-copy
    contractPath: ./node_modules/@jay-framework/ui-kit/dist/clipboard-copy.jay-contract
    source: plugin
    plugin: ui-kit
    templates: []
  - name: word-split
    contractPath: ./node_modules/@jay-framework/ui-kit/dist/word-split.jay-contract
    source: plugin
    plugin: ui-kit
    templates: []
  - name: letter-split
    contractPath: ./node_modules/@jay-framework/ui-kit/dist/letter-split.jay-contract
    source: plugin
    plugin: ui-kit
    templates: []
  - name: cart-indicator
    contractPath: ./node_modules/@jay-framework/wix-cart/dist/contracts/cart-indicator.jay-contract
    description: Cart indicator component showing item count, typically used in site
      header/navigation
    source: plugin
    plugin: wix-cart
    templates: []
  - name: cart-page
    contractPath: ./node_modules/@jay-framework/wix-cart/dist/contracts/cart-page.jay-contract
    description: Full cart page showing all items, quantities, totals, and checkout actions
    source: plugin
    plugin: wix-cart
    templates: []
  - name: mini-cart
    contractPath: ./node_modules/@jay-framework/wix-cart/dist/contracts/mini-cart.jay-contract
    description: Drawer that auto-opens when a product is added to cart. Place cart
      content inside.
    source: plugin
    plugin: wix-cart
    templates: []
  - name: login-indicator
    contractPath: ./node_modules/@jay-framework/wix-members/dist/contracts/login-indicator.jay-contract
    description: Shows member login state in site header/navigation. Provides
      login/register/logout buttons that redirect to Wix-hosted auth pages.
    source: plugin
    plugin: wix-members
    templates: []
  - name: auth-callback
    contractPath: ./node_modules/@jay-framework/wix-members/dist/contracts/auth-callback.jay-contract
    description: Handles OAuth callback after Wix-hosted login/register. Place as
      keyed component on the callback page.
    source: plugin
    plugin: wix-members
    templates: []
  - name: protected-page
    contractPath: ./node_modules/@jay-framework/wix-members/dist/contracts/protected-page.jay-contract
    description: Page-level login guard. Redirects visitors to login page if not
      authenticated. Use as a keyed component in the page head.
    source: plugin
    plugin: wix-members
    templates: []
  - name: product-search
    contractPath: ./node_modules/@jay-framework/wix-stores/dist/contracts/product-search.jay-contract
    description: Product listing with filters, sorting, and pagination. Use for
      search results and category pages.
    source: plugin
    plugin: wix-stores
    templates: []
  - name: category-products
    contractPath: ./node_modules/@jay-framework/wix-stores/dist/contracts/category-products.jay-contract
    description: Products from a specific category. Use for category product
      showcases, or as related products on a product page (pass productId to
      exclude the current product).
    source: plugin
    plugin: wix-stores
    templates: []
  - name: product-spotlight
    contractPath: ./node_modules/@jay-framework/wix-stores/dist/contracts/product-spotlight.jay-contract
    description: A single product card by slug. Use to feature a specific product on
      any page (homepage, content pages, etc.).
    source: plugin
    plugin: wix-stores
    templates: []
  - name: category-list
    contractPath: ./node_modules/@jay-framework/wix-stores/dist/contracts/category-list.jay-contract
    description: Displays a list of store categories. Use for category navigation
      grids and menus.
    source: plugin
    plugin: wix-stores
    templates: []
  - name: aiditor-shell
    contractPath: ./node_modules/@jay-framework/aiditor/dist/aiditor-shell.jay-contract
    description: POC shell for AIditor — banner text until full sidebar + iframe UI lands
    source: plugin
    plugin: aiditor
    templates: []
